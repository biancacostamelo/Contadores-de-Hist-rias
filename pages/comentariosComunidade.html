<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comunidade | Contadores de Histórias</title>
    <link rel="icon" href="../assets/Logo-principal.svg" />
    <link rel="stylesheet" href="../css/global.css" />
  </head>

  <body>
    <meu-header assets-path="../assets" base-path="../"></meu-header>
    <!--Inicio do conteúdo principal-->
    <main class="opened__forum">
      <section class="community-banner">
        <div class="banner-content">
          <h1 id="community-name">Mangá Club</h1>
          <p id="community-stats" class="stats"></p>
          <span id="community-category" class="category"></span>
        </div>
      </section>

      <section class="feed" aria-label="Feed de publicações">
        <nav class="feed-options" aria-label="Opções de ordenação">
          <div class="dropdown">
            <div class="custom-select-container">
              <select class="custom-select" id="sortFilter">
                <option value="popular" selected>Popular</option>
                <option value="recente">Recente</option>
              </select>
            </div>
          </div>
        </nav>

        <div class="edit-profile-section">
          <button type="button" class="btn-update" id="create-new-post-btn">
            <span aria-hidden="true"></span> Criar Publicação
          </button>
        </div>

        <dialog id="modal-criar-post" class="create-post-modal">
          <form method="dialog">
            <h2>Criar Novo Post</h2>
            <label for="input-novo-post">Publicação</label>
            <textarea
              id="input-novo-post"
              placeholder="O que você quer publicar?"
              rows="4"
            ></textarea>
            <div class="modal-actions">
              <button type="submit" id="btn-submit-post" class="btn-save-edit">
                Publicar
              </button>
              <button
                type="submit"
                value="cancel"
                formnovalidate
                class="btn-cancel-edit"
              >
                Cancelar
              </button>
            </div>
          </form>
        </dialog>
      </section>
    </main>

    <div
      class="auth-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="auth-modal-title"
      hidden
    >
      <div class="auth-modal-backdrop" data-close></div>
      <div class="auth-modal-content">
        <h2 id="auth-modal-title">Faça login para comentar</h2>
        <p>
          Para deixar seu comentário na comunidade, você precisa estar logado na
          sua conta.
        </p>
        <div class="auth-modal-actions">
          <a href="../pages/login.html" class="auth-modal-link">Fazer login</a>
          <button
            type="button"
            class="auth-modal-close-btn"
            data-close
            aria-label="Fechar"
          >
            ✕
          </button>
        </div>
      </div>
    </div>

    <div
      id="error-alert-container"
      role="alert"
      aria-live="assertive"
      hidden
    ></div>

    <dialog
      id="delete-confirmation-modal"
      class="delete-confirmation-modal"
      role="dialog"
      aria-labelledby="delete-modal-title"
    >
      <form method="dialog">
        <h2 id="delete-modal-title">Excluir comentário</h2>
        <p>Tem certeza que deseja excluir este comentário?</p>
        <blockquote class="delete-preview"></blockquote>
        <div class="modal-actions">
          <button type="submit" value="confirm">Excluir</button>
          <button type="submit" value="cancel" formnovalidate>Cancelar</button>
        </div>
      </form>
    </dialog>

    <script src="../js/auth.js"></script>
    <script src="../js/imageStore.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/comentariosComunidade.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/vlibras.js"></script>
  </body>
</html>
